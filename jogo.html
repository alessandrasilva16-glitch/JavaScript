<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donuts City</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="info">
        <h2>Pulos: <span id="pulos">0</span></h2>
        <h2>Tempo: <span id="tempo">0</span>s</h2>
    </div>

    <main class="game">

        <img src="city.jpg" class="city">

        <img src="Donuts.png" class="Donuts">

        <img src="Homer.gif" class="Homer">

    </main>

    <div class="game-over">

        <div class="painel">

            <h1>GAME OVER</h1>

            <button class="reiniciar">
                REINICIAR
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
